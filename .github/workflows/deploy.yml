name: Build and deploy static blog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Build the exact draft
        run: npm run build:static
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Capture the draft homepage
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory dist &
          for attempt in {1..15}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
              const response = await page.goto('http://127.0.0.1:8000/');
              if (response.status() !== 200) throw new Error('Homepage did not load');
              await page.locator('h1#profile-title').waitFor();
              await page.locator('img').evaluateAll(images => Promise.all(images.map(image => image.decode())));
              await page.waitForFunction(() => getComputedStyle(document.querySelector('nav')).display === 'flex');
              await page.screenshot({ path: 'homepage-preview.png', animations: 'disabled' });
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          JS
      - name: Save desktop screenshot
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: homepage-preview.png
          if-no-files-found: error
          retention-days: 1
